services:
  - type: web
    name: tms-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_HOST
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        value: TMSDB
      - key: DB_PORT
        value: "3306"
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGIN
        value: https://tms-ui-pi.vercel.app,http://localhost:5173,http://localhost:5000
